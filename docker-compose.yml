version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: email_assistant_db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - email_network

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email_assistant_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/email_assistant
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - email_network

networks:
  email_network:
    driver: bridge

volumes:
  mongo_data:
